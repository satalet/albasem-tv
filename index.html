<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الباسم سات | بوابة المشاهدة الذكية</title>
    
    <meta name="theme-color" content="#0B0E14">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root {
            --bg-main: #0B0E14;
            --bg-card: #151922;
            --border: #222938;
            --primary: #38BDF8;
            --accent-live: #10B981;
            --accent-movie: #F59E0B;
            --accent-series: #8B5CF6;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Cairo", sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 50px; }
        
        .header {
            background: linear-gradient(180deg, #151B28 0%, rgba(11,14,20,0) 100%);
            padding: 20px 15px;
            text-align: center;
        }
        .header h1 { font-size: 24px; font-weight: 900; color: #FFB703; }
        .header p { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

        .container { max-width: 1250px; margin: 0 auto; padding: 0 12px; }

        .search-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .search-box input[type="text"] {
            flex: 1;
            min-width: 200px;
            background: #0B0E14;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .btn-parse {
            background: #0284C7;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            height: 38px;
        }
        .btn-parse:disabled { background: #475569; cursor: not-allowed; }
        .btn-file {
            background: #10B981;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 14px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .portal-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }
        .portal-card {
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .portal-card.active { border-color: var(--primary); background: #1A2234; }
        .portal-card .icon { font-size: 26px; margin-bottom: 4px; }
        .portal-card h3 { font-size: 13px; margin-bottom: 4px; }
        .portal-card .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }
        .card-live .badge { background: rgba(16,185,129,0.15); color: var(--accent-live); }
        .card-movies .badge { background: rgba(245,158,11,0.15); color: var(--accent-movie); }
        .card-series .badge { background: rgba(139,92,246,0.15); color: var(--accent-series); }

        .packages-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 14px;
        }
        .packages-header {
            font-size: 12px;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .packages-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            white-space: nowrap;
        }
        .pkg-chip {
            background: #1E293B;
            border: 1px solid var(--border);
            color: #E2E8F0;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .pkg-chip:hover { background: #334155; }
        .pkg-chip.active {
            background: #0284C7;
            border-color: #38BDF8;
            color: #fff;
        }
        .pkg-count {
            background: rgba(0,0,0,0.3);
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 10px;
        }

        .filter-bar input {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            width: 100%;
            outline: none;
            margin-bottom: 14px;
            font-size: 13px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 12px;
        }
        .item-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .item-poster {
            width: 100%;
            height: 120px;
            background: #0B0E14;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            cursor: pointer;
            position: relative;
        }
        .item-poster img { width: 100%; height: 100%; object-fit: contain; }
        .no-logo { font-size: 34px; color: #475569; }
        
        .item-info {
            padding: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .item-title {
            font-size: 11px;
            font-weight: 700;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 28px;
        }
        .btn-play-browser {
            background: #10B981 !important;
            color: #fff !important;
            font-weight: 900 !important;
            border: none;
            padding: 6px 0;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 4px;
        }
        .btn-play-browser:hover { background: #059669 !important; }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .btn-grid a, .btn-grid button {
            color: #fff;
            border-radius: 6px;
            padding: 5px 0;
            font-size: 9px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            border: none;
            display: block;
        }
        .btn-android { background: #0284C7; }
        .btn-vlc { background: #EA580C; }
        .btn-mpv { background: #334155; }
        .btn-file-dl { background: #475569; }

        /* نافذة المشغل المباشر السينمائي */
        #player-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            z-index: 999999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .player-box {
            background: #151922;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 850px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .player-head {
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0B0E14;
            border-bottom: 1px solid var(--border);
        }
        video { width: 100%; height: auto; max-height: 65vh; background: #000; outline: none; }

        #toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #1E293B;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            display: none;
            z-index: 100000;
            border: 1px solid var(--primary);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>👑 الباسم سات | بوابة المشاهدة الذكية</h1>
        <p>⚡ يدعم البث المباشر فوراً داخل المتصفح ولكالي وأندرويد</p>
    </div>

    <div class="container">
        <div class="search-box">
            <input type="text" id="iptv_url" placeholder="ضع رابط M3U أو رابط سيرفر Xtream هنا..." />
            <button class="btn-parse" id="btn_parse_trigger">فرز وتشغيل ⚡</button>
            <label class="btn-file" for="m3u_file">📁 فتح ملف M3U</label>
            <input type="file" id="m3u_file" accept=".m3u,.m3u8,.txt" style="display:none;">
        </div>

        <div class="portal-grid">
            <div class="portal-card card-live active" id="tab_live">
                <div class="icon">📺</div>
                <h3>المحطات</h3>
                <span class="badge" id="count-live">0</span>
            </div>
            <div class="portal-card card-movies" id="tab_movies">
                <div class="icon">🎬</div>
                <h3>الأفلام</h3>
                <span class="badge" id="count-movies">0</span>
            </div>
            <div class="portal-card card-series" id="tab_series">
                <div class="icon">🍿</div>
                <h3>المسلسلات</h3>
                <span class="badge" id="count-series">0</span>
            </div>
        </div>

        <div class="packages-section" id="packages_section" style="display:none;">
            <div class="packages-header">📁 اختر الباقة للتصفية السريعة:</div>
            <div class="packages-bar" id="packages_bar"></div>
        </div>

        <div class="filter-bar">
            <input type="text" id="search_input" placeholder="🔍 ابحث بالاسم في الباقة المحددة..." />
        </div>

        <div id="loader" style="display:none; text-align:center; padding:20px; color:#38BDF8;">⏳ جاري جلب وفرز المحتوى...</div>
        <div class="items-grid" id="items_container"></div>
    </div>

    <!-- المشغل السينمائي المدمج -->
    <div id="player-modal">
        <div class="player-box">
            <div class="player-head">
                <span id="player-title" style="color:#FFB703; font-weight:bold; font-size:14px;"></span>
                <button onclick="closePlayer()" style="background:none; border:none; color:#EF4444; font-size:22px; cursor:pointer; font-weight:bold;">✕</button>
            </div>
            <video id="video-player" controls autoplay playsinline></video>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const PROXY_URL = "https://tv-stream-proxy.satalet.workers.dev/?url=";
        let currentTab = "live";
        let currentGroup = "all";
        let rawData = { live: [], movies: [], series: [] };
        let hlsInstance = null;

        // محول الروابط الذكي لتفادي حظر المتصفحات (Mixed Content)
        class StreamProxyLoader extends Hls.DefaultConfig.loader {
            load(context, config, callbacks) {
                if (context.url && context.url.startsWith("http://")) {
                    context.url = PROXY_URL + encodeURIComponent(context.url);
                }
                super.load(context, config, callbacks);
            }
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.style.display = "block";
            setTimeout(() => { t.style.display = "none"; }, 2000);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const saved = localStorage.getItem("albasem_url");
            if (saved) document.getElementById("iptv_url").value = saved;

            document.getElementById("btn_parse_trigger").addEventListener("click", loadAndParse);
            document.getElementById("m3u_file").addEventListener("change", handleFileSelect);
            document.getElementById("search_input").addEventListener("input", renderItems);

            document.getElementById("tab_live").addEventListener("click", () => switchSection("live"));
            document.getElementById("tab_movies").addEventListener("click", () => switchSection("movies"));
            document.getElementById("tab_series").addEventListener("click", () => switchSection("series"));

            if (saved) loadAndParse();
        });

        async function fetchSmart(url) {
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const txt = await res.text();
                    if (txt && txt.length > 20) return txt;
                }
            } catch(e) {}

            const resProxy = await fetch(PROXY_URL + encodeURIComponent(url));
            if (!resProxy.ok) throw new Error("تعذر جلب الرابط من السيرفر");
            return await resProxy.text();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById("loader").style.display = "block";
            document.getElementById("items_container").innerHTML = "";

            const reader = new FileReader();
            reader.onload = function(e) {
                rawData = { live: [], movies: [], series: [] };
                parseM3UContent(e.target.result);
                document.getElementById("loader").style.display = "none";
                updateCounts();
                buildPackagesBar();
                renderItems();
                showToast("تم فتح الملف وتصنيف الباقات بنجاح ✅");
            };
            reader.readAsText(file);
        }

        async function loadAndParse() {
            let url = document.getElementById("iptv_url").value.trim();
            if (!url) return alert("يرجى إدخال الرابط أولاً!");

            localStorage.setItem("albasem_url", url);
            const btn = document.getElementById("btn_parse_trigger");
            const loader = document.getElementById("loader");

            btn.disabled = true;
            loader.style.display = "block";
            document.getElementById("items_container").innerHTML = "";
            rawData = { live: [], movies: [], series: [] };

            try {
                const text = await fetchSmart(url);
                parseM3UContent(text);
                updateCounts();
                buildPackagesBar();
                renderItems();
                showToast("تم جلب وتصنيف الباقات بنجاح ⚡");
            } catch (err) {
                alert(err.message);
            } finally {
                loader.style.display = "none";
                btn.disabled = false;
            }
        }

        function parseM3UContent(text) {
            const lines = text.split(/\r?\n/);
            let current = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                if (line.startsWith("#EXTINF:")) {
                    const nameMatch = line.match(/,(.+)$/);
                    const name = nameMatch ? nameMatch[1].trim() : "بث مباشر";
                    const logoMatch = line.match(/tvg-logo=\"([^\"]+)\"/i) || line.match(/tvg-logo='([^']+)'/i);
                    const logo = logoMatch ? logoMatch[1] : "";
                    const groupMatch = line.match(/group-title=\"([^\"]+)\"/i) || line.match(/group-title='([^']+)'/i);
                    const group = groupMatch ? groupMatch[1].trim() : "عام";
                    current = { name, logo, group };
                } else if (!line.startsWith("#") && current) {
                    current.url = line;
                    const u = line.toLowerCase();
                    const g = current.group.toLowerCase();

                    if (u.includes("/series/") || g.includes("series") || g.includes("مسلسل")) {
                        rawData.series.push(current);
                    } else if (u.includes("/movie/") || u.endsWith(".mp4") || u.endsWith(".mkv") || g.includes("movie") || g.includes("فلم")) {
                        rawData.movies.push(current);
                    } else {
                        rawData.live.push(current);
                    }
                    current = null;
                }
            }
        }

        function updateCounts() {
            document.getElementById("count-live").innerText = rawData.live.length;
            document.getElementById("count-movies").innerText = rawData.movies.length;
            document.getElementById("count-series").innerText = rawData.series.length;
        }

        function switchSection(tab) {
            currentTab = tab;
            currentGroup = "all";
            document.querySelectorAll(".portal-card").forEach(c => c.classList.remove("active"));
            document.getElementById("tab_" + tab).classList.add("active");
            buildPackagesBar();
            renderItems();
        }

        function buildPackagesBar() {
            const section = document.getElementById("packages_section");
            const bar = document.getElementById("packages_bar");
            bar.innerHTML = "";

            const items = rawData[currentTab] || [];
            if (items.length === 0) {
                section.style.display = "none";
                return;
            }

            section.style.display = "block";

            const groupsMap = {};
            items.forEach(it => {
                const g = it.group || "عام";
                groupsMap[g] = (groupsMap[g] || 0) + 1;
            });

            const allChip = document.createElement("div");
            allChip.className = "pkg-chip" + (currentGroup === "all" ? " active" : "");
            allChip.innerHTML = `<span>الكل</span> <span class="pkg-count">${items.length}</span>`;
            allChip.onclick = () => {
                currentGroup = "all";
                document.querySelectorAll(".pkg-chip").forEach(c => c.classList.remove("active"));
                allChip.classList.add("active");
                renderItems();
            };
            bar.appendChild(allChip);

            Object.keys(groupsMap).sort().forEach(grp => {
                const chip = document.createElement("div");
                chip.className = "pkg-chip" + (currentGroup === grp ? " active" : "");
                chip.innerHTML = `<span>${grp}</span> <span class="pkg-count">${groupsMap[grp]}</span>`;
                chip.onclick = () => {
                    currentGroup = grp;
                    document.querySelectorAll(".pkg-chip").forEach(c => c.classList.remove("active"));
                    chip.classList.add("active");
                    renderItems();
                };
                bar.appendChild(chip);
            });
        }

        function renderItems() {
            const container = document.getElementById("items_container");
            container.innerHTML = "";
            const q = (document.getElementById("search_input").value || "").trim().toLowerCase();
            
            let list = rawData[currentTab] || [];

            if (currentGroup !== "all") {
                list = list.filter(item => (item.group || "عام") === currentGroup);
            }

            if (q) {
                list = list.filter(item => item.name && item.name.toLowerCase().includes(q));
            }

            const displayList = list.slice(0, 150);

            if (displayList.length === 0) {
                container.innerHTML = "<div style='grid-column:1/-1;text-align:center;padding:40px;color:#64748B;'>لا توجد عناصر في هذه الباقة.</div>";
                return;
            }

            displayList.forEach(st => {
                const streamUrl = st.url;
                const cleanHost = streamUrl.replace(/^https?:\/\//, '');
                const scheme = streamUrl.startsWith("https://") ? "https" : "http";

                const androidIntent = `intent://${cleanHost}#Intent;scheme=${scheme};type=video/*;action=android.intent.action.VIEW;S.title=${encodeURIComponent(st.name)};end`;
                const vlcDirect = `vlc://${streamUrl}`;

                const card = document.createElement("div");
                card.className = "item-card";

                const poster = document.createElement("div");
                poster.className = "item-poster";
                poster.onclick = () => playInBrowser(streamUrl, st.name);

                if (st.logo) {
                    const img = document.createElement("img");
                    img.src = st.logo;
                    img.loading = "lazy";
                    img.onerror = () => { poster.innerHTML = "<div class='no-logo'>📺</div>"; };
                    poster.appendChild(img);
                } else {
                    poster.innerHTML = "<div class='no-logo'>📺</div>";
                }

                const info = document.createElement("div");
                info.className = "item-info";
                info.innerHTML = `
                    <div class="item-title" title="${st.name}">${st.name}</div>
                    <button class="btn-play-browser" onclick="playInBrowser('${streamUrl}', '${st.name}')">تشغيل بالمتصفح ▶</button>
                    <div class="btn-grid">
                        <a class="btn-android" href="${androidIntent}">أندرويد 📱</a>
                        <a class="btn-vlc" href="${vlcDirect}">VLC 🚀</a>
                        <button class="btn-mpv" onclick="copyMPV('${streamUrl}')">MPV 📋</button>
                        <button class="btn-file-dl" onclick="downloadPlayFile('${streamUrl}', '${st.name}')">ملف ⚡</button>
                    </div>
                `;

                card.appendChild(poster);
                card.appendChild(info);
                container.appendChild(card);
            });
        }

        // تشغيل مباشر داخل المتصفح عبر HLS.js والمحول الذكي
        function playInBrowser(url, title) {
            const modal = document.getElementById("player-modal");
            const video = document.getElementById("video-player");
            document.getElementById("player-title").textContent = title;
            modal.style.display = "flex";

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            const targetSource = PROXY_URL + encodeURIComponent(url);

            if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    loader: StreamProxyLoader,
                    enableWorker: true,
                    lowLatencyMode: true
                });
                hlsInstance.loadSource(targetSource);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("User gesture required"));
                });
                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        showToast("تعذر البث الداخلي - جرب المشغل الخارجي (VLC / أندرويد)");
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = targetSource;
                video.play();
            } else {
                video.src = targetSource;
                video.play();
            }
        }

        function closePlayer() {
            const modal = document.getElementById("player-modal");
            const video = document.getElementById("video-player");
            modal.style.display = "none";
            video.pause();
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
        }

        function downloadPlayFile(url, name) {
            const m3uContent = `#EXTM3U\n#EXTINF:-1,${name}\n${url}\n`;
            const blob = new Blob([m3uContent], { type: "audio/x-mpegurl" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${name.replace(/[^a-zA-Z0-9]/g, '_')}.m3u`;
            link.click();
            showToast("تم فتح القناة بمشغل هاتفك 🎬");
        }

        function copyMPV(url) {
            const cmd = `mpv "${url}"`;
            navigator.clipboard.writeText(cmd).then(() => {
                showToast("تم نسخ أمر MPV لتيرمنال كالي 📋");
            });
        }
    </script>
</body>
</html>
