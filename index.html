<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الباسم سات | البث السريع</title>
    
    <meta name="theme-color" content="#0B0E14">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root {
            --bg-main: #0B0E14;
            --bg-card: #151922;
            --border: #222938;
            --primary: #38BDF8;
            --accent-live: #10B981;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Cairo", sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 30px; }
        
        .header {
            background: linear-gradient(180deg, #151B28 0%, rgba(11,14,20,0) 100%);
            padding: 20px 15px;
            text-align: center;
        }
        .header h1 { font-size: 24px; font-weight: 900; color: #FFB703; }
        .header p { color: var(--text-muted); font-size: 13px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 12px; }

        .search-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .search-box input {
            flex: 1;
            min-width: 200px;
            background: #0B0E14;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .btn-action {
            background: #0284C7;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            height: 38px;
        }
        .btn-action:disabled { background: #475569; cursor: not-allowed; }

        .categories-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0;
            margin-bottom: 15px;
            white-space: nowrap;
        }
        .cat-chip {
            background: #1E293B;
            border: 1px solid var(--border);
            color: #E2E8F0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-chip.active {
            background: #0284C7;
            border-color: #38BDF8;
            color: #fff;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .item-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .item-poster {
            width: 100%;
            height: 130px;
            background: #0B0E14;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }
        .item-poster img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
        .no-logo { font-size: 34px; color: #475569; }
        
        .item-info {
            padding: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .item-title {
            font-size: 11px;
            font-weight: 700;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 28px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .btn-grid button, .btn-grid a {
            background: #1E293B;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 5px 0;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-play-now {
            background: #10B981 !important;
            grid-column: span 2;
            border: none !important;
        }

        #player-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .player-box {
            background: #151922;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            overflow: hidden;
        }
        .player-head {
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0B0E14;
        }
        video { width: 100%; max-height: 65vh; background: #000; }

        #toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #1E293B;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            display: none;
            z-index: 100000;
            border: 1px solid var(--primary);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>👑 الباسم سات | بوابة البث السريع</h1>
        <p>⚡ تشغيل مباشر عبر المتصفح وللجوال وكالي لينكس</p>
    </div>

    <div class="container">
        <div class="search-box">
            <input type="text" id="iptv_url" placeholder="ضع رابط السيرفر هنا..." />
            <button class="btn-action" id="btn_connect">اتصال بالسيرفر ⚡</button>
        </div>

        <div class="categories-bar" id="categories_bar"></div>

        <div id="loader" style="display:none; text-align:center; padding:20px; color:#38BDF8;">⏳ جاري الاتصال وجلب القنوات...</div>
        <div class="items-grid" id="items_container"></div>
    </div>

    <div id="player-modal">
        <div class="player-box">
            <div class="player-head">
                <span id="player-title" style="color:#FFB703; font-weight:bold; font-size:13px;"></span>
                <button onclick="closePlayer()" style="background:none; border:none; color:#fff; font-size:18px; cursor:pointer;">✕</button>
            </div>
            <video id="video-player" controls playsinline></video>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        let serverConfig = null;
        let hls = null;

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.style.display = "block";
            setTimeout(() => { t.style.display = "none"; }, 2000);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const saved = localStorage.getItem("albasem_url") || "http://SHOFTV.NET:80/get.php?username=97339666628&password=Mi14687435777&type=m3u_plus&output=m3u8";
            document.getElementById("iptv_url").value = saved;
            document.getElementById("btn_connect").addEventListener("click", initXtream);
        });

        async function fetchAPI(url) {
            const proxy = "https://tv-stream-proxy.satalet.workers.dev/?url=" + encodeURIComponent(url);
            const res = await fetch(proxy);
            if (!res.ok) throw new Error("تعذر جلب البيانات");
            return await res.json();
        }

        async function initXtream() {
            const urlInput = document.getElementById("iptv_url").value.trim();
            if (!urlInput) return;

            localStorage.setItem("albasem_url", urlInput);
            const loader = document.getElementById("loader");
            const btn = document.getElementById("btn_connect");

            loader.style.display = "block";
            btn.disabled = true;

            try {
                const u = new URL(urlInput);
                const base = u.protocol + "//" + u.host;
                const user = u.searchParams.get("username");
                const pass = u.searchParams.get("password");

                serverConfig = { base, user, pass };

                const catUrl = `${base}/player_api.php?username=${user}&password=${pass}&action=get_live_categories`;
                const categories = await fetchAPI(catUrl);

                renderCategories(categories);
                showToast("تم جلب الأقسام بنجاح ✅");

                if (categories.length > 0) {
                    loadStreamsForCategory(categories[0].category_id);
                }
            } catch (err) {
                alert("حدث خطأ في الاتصال: " + err.message);
            } finally {
                loader.style.display = "none";
                btn.disabled = false;
            }
        }

        function renderCategories(categories) {
            const bar = document.getElementById("categories_bar");
            bar.innerHTML = "";

            categories.forEach((cat, idx) => {
                const chip = document.createElement("div");
                chip.className = "cat-chip" + (idx === 0 ? " active" : "");
                chip.textContent = cat.category_name;
                chip.onclick = () => {
                    document.querySelectorAll(".cat-chip").forEach(c => c.classList.remove("active"));
                    chip.classList.add("active");
                    loadStreamsForCategory(cat.category_id);
                };
                bar.appendChild(chip);
            });
        }

        async function loadStreamsForCategory(catId) {
            const loader = document.getElementById("loader");
            const container = document.getElementById("items_container");
            loader.style.display = "block";
            container.innerHTML = "";

            try {
                const streamsUrl = `${serverConfig.base}/player_api.php?username=${serverConfig.user}&password=${serverConfig.pass}&action=get_live_streams&category_id=${catId}`;
                const streams = await fetchAPI(streamsUrl);
                renderStreams(streams);
            } catch (e) {
                showToast("تعذر جلب قنوات هذا القسم");
            } finally {
                loader.style.display = "none";
            }
        }

        function renderStreams(streams) {
            const container = document.getElementById("items_container");
            container.innerHTML = "";

            if (!streams || streams.length === 0) {
                container.innerHTML = "<div style='grid-column:1/-1;text-align:center;padding:20px;color:#64748B;'>لا توجد قنوات هنا</div>";
                return;
            }

            streams.forEach(st => {
                const streamUrl = `${serverConfig.base}/live/${serverConfig.user}/${serverConfig.pass}/${st.stream_id}.m3u8`;

                const card = document.createElement("div");
                card.className = "item-card";

                const poster = document.createElement("div");
                poster.className = "item-poster";
                poster.onclick = () => playMedia(streamUrl, st.name);

                if (st.stream_icon) {
                    const img = document.createElement("img");
                    img.src = st.stream_icon;
                    img.loading = "lazy";
                    img.onerror = () => { poster.innerHTML = "<div class='no-logo'>📺</div>"; };
                    poster.appendChild(img);
                } else {
                    poster.innerHTML = "<div class='no-logo'>📺</div>";
                }

                const info = document.createElement("div");
                info.className = "item-info";
                info.innerHTML = `
                    <div class="item-title" title="${st.name}">${st.name}</div>
                    <div class="btn-grid">
                        <button class="btn-play-now" onclick="playMedia('${streamUrl}', '${st.name}')">تشغيل بالمتصفح ▶</button>
                        <a href="intent://${streamUrl.replace(/^https?:\/\//, '')}#Intent;type=video/*;action=android.intent.action.VIEW;end">أندرويد 📱</a>
                        <button onclick="copyCmd('${streamUrl}')">أمر MPV 📋</button>
                    </div>
                `;

                card.appendChild(poster);
                card.appendChild(info);
                container.appendChild(card);
            });
        }

        function playMedia(url, title) {
            const modal = document.getElementById("player-modal");
            const video = document.getElementById("video-player");
            document.getElementById("player-title").textContent = title;
            modal.style.display = "flex";

            if (hls) hls.destroy();

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else {
                video.src = url;
                video.play();
            }
        }

        function closePlayer() {
            const modal = document.getElementById("player-modal");
            const video = document.getElementById("video-player");
            modal.style.display = "none";
            video.pause();
            if (hls) hls.destroy();
        }

        function copyCmd(url) {
            const cmd = `mpv "${url}"`;
            navigator.clipboard.writeText(cmd).then(() => {
                showToast("تم نسخ أمر MPV لتيرمنال كالي 📋");
            });
        }
    </script>
</body>
</html>
